name: Release

# Creates the GitHub release that HACS consumes. Two triggers:
# - push of a tag v*  (the tag already exists)
# - workflow_dispatch with the version from manifest.json (creates tag + release)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Determine version
        id: version
        run: |
          python3 - <<'PY'
          import json, os, sys
          version = json.load(open("custom_components/vag_data_act/manifest.json"))["version"]
          ref = os.environ.get("GITHUB_REF_NAME", "")
          if os.environ["GITHUB_REF_TYPE"] == "tag" and ref.lstrip("v") != version:
              print(f"tag {ref} does not match manifest version {version}")
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"tag=v{version}\n")
          print(f"release tag v{version}")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body_path: ${{ github.workspace }}/RELEASE_NOTES.md
